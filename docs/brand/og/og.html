<!doctype html>
<!-- Social preview (1200 x 630) of monsalaire. Country-neutral on purpose (Kévin, 4 November 2026): it only changes
     with a major change of the product, never when a country is added. Rendered by docs/brand/og/render.sh into public/og-fr.png and og-en.png. -->
<html>
<head>
<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=Outfit:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; }
  body { background: #f3efe6; font-family: IBM Plex Sans, sans-serif; color: #14201a; position: relative; }
  .card { position: absolute; inset: 0; padding: 78px 84px 0; box-sizing: border-box; }
  .lockup { width: 560px; display: block; }
  h1 { font-family: Outfit, sans-serif; font-weight: 600; font-size: 54px; line-height: 1.12; letter-spacing: -0.02em; margin: 54px 0 18px; max-width: 980px; color: #073f2a; text-wrap: balance; }
  p { font-size: 27px; line-height: 1.4; margin: 0; color: #4a564f; max-width: 960px; }
  .foot { position: absolute; left: 84px; right: 84px; bottom: 54px; display: flex; justify-content: space-between; align-items: center; font-size: 22px; color: #4a564f; }
  .by { display: flex; align-items: center; gap: 10px; }
  .by img { width: 26px; height: 26px; }
  .by b { color: #14201a; font-weight: 600; }
  .flag { position: absolute; left: 0; right: 0; bottom: 0; height: 12px; display: flex; }
  .flag i { flex: 1; } .flag i:nth-child(1) { background: #209b44; } .flag i:nth-child(2) { background: #f5b102; } .flag i:nth-child(3) { background: #e60514; }
</style>
</head>
<body>
  <div class="card">
    <img class="lockup" src="../../../public/brand/lockup.png" alt="">
    <h1 id="h"></h1>
    <p id="p"></p>
  </div>
  <div class="foot"><span>monsalaire.aconta.io</span><span class="by"><span id="by"></span><img src="../../../public/brand/aconta-emblem.png" alt=""><b>Aconta</b></span></div>
  <div class="flag"><i></i><i></i><i></i></div>
  <script>
    const en = location.hash === '#en';
    document.documentElement.lang = en ? 'en' : 'fr';
    document.getElementById('h').textContent = en ? 'Your payslip, worked out as you type.' : 'Votre bulletin de paie, calculé sous vos yeux.';
    document.getElementById('p').textContent = en ? 'Gross to net pay, income tax, social contributions and employer cost. Every line cites the law behind it. Free and open source.' : 'Du brut au net, impôt, cotisations sociales et coût employeur. Chaque ligne cite le texte officiel. Gratuit et libre.';
    document.getElementById('by').textContent = en ? 'by' : 'par';
  </script>
</body>
</html>
