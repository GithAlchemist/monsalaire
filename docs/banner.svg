    <text x="26" y="72" font-family="'Instrument Serif', Georgia, serif" font-size="24" fill="#17140f">Novembre 2026</text>
    <g font-family="'Geist Mono', Menlo, monospace" font-size="12.5" fill="#17140f">
      <text x="26" y="112">Salaire de base</text><text x="314" y="112" text-anchor="end">350 000</text>
      <text x="26" y="138">Primes et ancienneté</text><text x="314" y="138" text-anchor="end">73 075</text>
      <text x="26" y="164">CNSS, retraite</text><text x="314" y="164" text-anchor="end" fill="#a4261d">− 16 923</text>
      <text x="26" y="190">AMU</text><text x="314" y="190" text-anchor="end" fill="#a4261d">− 21 154</text>
