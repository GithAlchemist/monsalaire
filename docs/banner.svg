  <text x="72" y="222" font-family="Geist, Inter, Helvetica, Arial, sans-serif" font-size="52" font-weight="650" fill="#f4efe2" letter-spacing="-2">Your payslip,</text>
  <text x="72" y="282" font-family="'Instrument Serif', Georgia, serif" font-style="italic" font-size="58" fill="#f2c94c">computed before your eyes.</text>
  <text x="72" y="330" font-family="Geist, Inter, Helvetica, Arial, sans-serif" font-size="19" fill="#f4efe2" fill-opacity="0.72">Votre bulletin de paie au Togo, calculé sous vos yeux · open source · every line sourced</text>
