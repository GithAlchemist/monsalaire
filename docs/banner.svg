      <stop offset="0.16" stop-color="#0d6b47"/><stop offset="0.58" stop-color="#0d6b47"/>
      <stop offset="0.58" stop-color="#f2c230"/><stop offset="1" stop-color="#f2c230"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#000" flood-opacity="0.35"/>
    </filter>
  </defs>
  <rect width="1280" height="400" rx="28" fill="#0d4f37"/>
  <rect width="1280" height="400" rx="28" fill="url(#glow)"/>
  <g transform="translate(72 92)">
