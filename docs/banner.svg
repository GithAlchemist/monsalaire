    <text x="36" y="263" font-family="Geist, Helvetica, Arial, sans-serif" font-size="11" font-weight="650" letter-spacing="2" fill="#f4efe2">NET À PAYER</text>
    <text x="304" y="265" text-anchor="end" font-family="'Geist Mono', Menlo, monospace" font-size="19" font-weight="650" fill="#f4efe2">379 833 F</text>
